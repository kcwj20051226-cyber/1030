<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>報名名單</title>
</head>
<body>
    <h1>活動報名名單</h1>

    {% if event %}
        <h2>{{ event[1] }}</h2>
        <p><strong>活動時間：</strong>{{ event[3] }}</p>
        <p><strong>活動地點：</strong>{{ event[4] }}</p>

        {% if registrations %}
            <ul>
                {% for r in registrations %}
                    <li>{{ r[2] }} - {{ r[3] }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>目前尚無報名資料。</p>
        {% endif %}
    {% else %}
        <p>查無此活動</p>
    {% endif %}

    <br>
    <a href="/">⬅️ 返回活動列表</a>
</body>
</html>
