<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>活動報名</title>
</head>
<body>
    <h1>活動報名</h1>

    {% if event %}
        <p><strong>活動名稱：</strong>{{ event[1] }}</p>
        <p><strong>活動說明：</strong>{{ event[2] }}</p>
        <p><strong>活動時間：</strong>{{ event[3] }}</p>
        <p><strong>活動地點：</strong>{{ event[4] }}</p>

        <form action="/register/{{ event[0] }}" method="post">
            <div>
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="phone">連絡電話：</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <button type="submit">送出報名</button>
        </form>
    {% else %}
        <p>查無此活動</p>
    {% endif %}

    <br>
    <a href="/">⬅️ 返回活動列表</a>
</body>
</html>
